<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="apple-mobile-web-app-capable" content="yes">

<title>Afterglow</title>
<style>
  :root { --bg: #121212; --raised: #1e1e1e; --raised2: #2a2a2a; --line: #2c2c2c; --text: #fff; --dim: #b3b3b3; --faint: #7a7a7a; --pink: #ff5d8f; --ink: #121212;

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  svg { width: 24px; height: 24px; fill: currentColor; display: block; }
  svg.line { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  [hidden] { display: none !important; }
  .one { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  #app { height: 100dvh; display: flex; flex-direction: column; max-width: 640px; margin: 0 auto; }
  header { display: flex; align-items: center; gap: 12px; padding: calc(var(--top) + 14px) 16px 8px; }
  header h1 { font-size: 26px; margin: 0; flex: 1; letter-spacing: -.02em; }
  .pill { display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 16px; border-radius: 999px; background: var(--raised2); font-weight: 600; font-size: 14px; white-space: nowrap; }
  .pill.on { background: var(--pink); color: var(--ink); }
  .pill.main { background: var(--pink); color: var(--ink); font-weight: 700; }
  .pill svg { width: 18px; height: 18px; }
  #hint { margin: 4px 16px 8px; padding: 12px 14px; border-radius: 10px; background: var(--raised); border: 1px solid var(--line); font-size: 14px; color: var(--dim); display: flex; gap: 10px; align-items: flex-start; }
  #hint b { color: var(--text); } #hint .ar { direction: rtl; text-align: right; margin-top: 4px; } #hint button { color: var(--faint); min-width: 32px; min-height: 32px; }
  .search { padding: 4px 16px 8px; }
  .search input, .field { width: 100%; font: inherit; font-size: 16px; color: var(--text); background: var(--raised2); border: 0; border-radius: 10px; padding: 11px 14px; outline: none; -webkit-user-select: text; user-select: text; }
  .search input::placeholder, .field::placeholder { color: var(--faint); }
  #chips { display: flex; gap: 8px; padding: 2px 16px 10px; overflow-x: auto; scrollbar-width: none; } #chips::-webkit-scrollbar { display: none; }
  #chips .gap { flex: 1; }
  #chips .sort { background: none; color: var(--dim); padding: 0 6px; font-weight: 500; }
  main { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding-bottom: 12px; }
  .row { display: flex; align-items: center; gap: 12px; padding: 7px 8px 7px 16px; min-height: 62px; }
  .row:active { background: #ffffff0d; }
  .art { width: 48px; height: 48px; border-radius: 4px; flex: none; object-fit: cover; display: flex; align-items: center; justify-content: center; color: #ffffffb3; overflow: hidden; }
  .art svg { width: 22px; height: 22px; }
  .row .what { flex: 1; min-width: 0; }
  .row .t { font-weight: 600; } .row .t.now { color: var(--pink); }
  .row .a { color: var(--dim); font-size: 14px; }
  .icon { width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; flex: none; color: var(--dim); border-radius: 50%; }
  .icon:active { background: #ffffff14; }
  .head { padding: 6px 16px 12px; }
  .head h2 { margin: 0 0 2px; font-size: 22px; } .head .a { color: var(--dim); font-size: 14px; }
  .head .do { display: flex; gap: 10px; margin-top: 12px; align-items: center; }
  .empty { padding: 36px 28px; text-align: center; color: var(--dim); }
  .empty h2 { color: var(--text); margin: 0 0 8px; font-size: 20px; } .empty p { margin: 6px 0; } .empty .ar { direction: rtl; } .empty .pill { margin-top: 16px; min-height: 50px; padding: 0 26px; font-size: 16px; }
  .foot { padding: 18px 16px 8px; color: var(--faint); font-size: 13px; text-align: center; }

  #mini { margin: 0 8px calc(var(--bottom) + 8px); border-radius: 8px; background: var(--song); display: flex; align-items: center; gap: 10px; padding: 8px 4px 8px 8px; position: relative; overflow: hidden; }
  #mini .art { width: 42px; height: 42px; } #mini .what { flex: 1; min-width: 0; } #mini .t { font-weight: 600; font-size: 14px; } #mini .a { font-size: 13px; color: #ffffffc0; }
  #mini .icon { color: #fff; } #mini .bar { position: absolute; left: 8px; right: 8px; bottom: 0; height: 2px; background: #ffffff33; } #mini .bar i { display: block; height: 100%; width: 0; background: #fff; }

  #player { position: fixed; inset: 0; z-index: 10; background: linear-gradient(var(--song), #121212 85%); display: flex; flex-direction: column; padding: calc(var(--top) + 8px) 24px calc(var(--bottom) + 18px); transform: translateY(100%); transition: transform .32s cubic-bezier(.2,.8,.2,1); }
  #player.open { transform: none; }
  #player .bar1 { display: flex; align-items: center; height: 52px; margin: 0 -10px; } #player .bar1 .mid { flex: 1; text-align: center; min-width: 0; } #player .bar1 small { display: block; font-size: 11px; letter-spacing: .08em; color: #ffffffb3; } #player .bar1 b { font-size: 14px; }
  #player .icon { color: #fff; }
  #player .coverbox { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 12px 0; }
  #player .cover { width: min(100%, 52dvh); aspect-ratio: 1; border-radius: 8px; object-fit: cover; box-shadow: 0 12px 40px #0008; display: flex; align-items: center; justify-content: center; color: #ffffffb3; }
  #player .cover svg { width: 36%; height: 36%; }
  #player .name { display: flex; align-items: center; gap: 8px; } #player .name .what { flex: 1; min-width: 0; } #player .name .t { font-size: 22px; font-weight: 700; } #player .name .a { color: #ffffffc0; }

  input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 28px; background: none; margin: 10px 0 0; --p: 0%; }
  input[type=range]::-webkit-slider-runnable-track { height: 4px; border-radius: 2px; background: linear-gradient(90deg, var(--accent) var(--p), #ffffff40 var(--p)); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%; background: #fff; margin-top: -5px; }
  input[type=range]::-moz-range-track { height: 4px; border-radius: 2px; background: linear-gradient(90deg, var(--accent) var(--p), #ffffff40 var(--p)); }
  input[type=range]::-moz-range-thumb { width: 14px; height: 14px; border: 0; border-radius: 50%; background: #fff; }
  #player .times { display: flex; justify-content: space-between; font-size: 12px; color: #ffffffb3; font-variant-numeric: tabular-nums; }

  #shade { position: fixed; inset: 0; z-index: 20; background: #000a; display: flex; align-items: flex-end; justify-content: center; }

  #sheet h3 { margin: 6px 20px 2px; font-size: 17px; } #sheet .sub { margin: 0 20px 8px; color: var(--dim); font-size: 14px; }

  #sheet .form { padding: 8px 20px 4px; display: flex; gap: 10px; } #sheet .form .field { flex: 1; }
  #toast { margin: 0 16px 8px; background: #f3eff8; color: var(--ink); font-size: 14px; font-weight: 600; padding: 10px 14px; border-radius: 8px; text-align: center; }
  .row .t, .row .a, #mini .t, #mini .a, #player .name .t, #player .name .a, #sheet h3, #sheet .sub, .head h2 { text-align: left; }
</style>

<body>
<div id="app">
  <header><h1>Afterglow</h1><button class="pill main" data-do="add" id="add"></button></header>
  <div id="toast" role="status" hidden></div>
  <div id="hint" hidden></div>
  <div class="search"><input id="q" type="search" placeholder="Search your songs" autocomplete="off" autocapitalize="off" aria-label="Search your songs"></div>
  <nav id="chips"></nav>
  <main id="list"></main>
  <div id="mini" hidden></div>
</div>
<section id="player" aria-label="Player" aria-hidden="true"></section>
<div id="shade" hidden><div id="sheet" role="dialog"></div></div>
<input type="file" id="files" multiple accept="audio/*,.mp3,.m4a,.aac,.wav,.flac,.ogg,.opus,.mp4,.m4b" hidden>
<audio id="audio" playsinline preload="auto"></audio>

<script>
(() => {

const count = (n, one) => n + ' ' + one + (n === 1 ? '' : 's');
const standalone = window.navigator.standalone === true || (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);

// ------------------------------------------------------------------ icons (drawn for this page)
const svg = (d, line) => '<svg viewBox="0 0 24 24" aria-hidden="true"' + (line ? ' class="line"' : '') + '>' + d + '</svg>';
const I = {
  play: svg('<path d="M8 5v14l11-7z"/>'), pause: svg('<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>'),
  next: svg('<path d="M6 6l8.5 6L6 18zM16 6h2v12h-2z"/>'), prev: svg('<path d="M18 6l-8.5 6 8.5 6zM6 6h2v12H6z"/>'),
  heart: svg('<path d="M12 21l-1.5-1.3C5.4 15.1 2 12 2 8.3 2 5.3 4.3 3 7.3 3c1.7 0 3.3.8 4.7 2.1C13.4 3.8 15 3 16.7 3 19.7 3 22 5.3 22 8.3c0 3.7-3.4 6.8-8.5 11.4z"/>'),
  heartLine: svg('<path d="M12 20.3l-1-.9C6.3 15.1 3 12.200 3 8.500 3 5.900 5 4 7.500 4c1.700 0 3.300.900 4.500 2.400C13.200 4.900 14.800 4 16.500 4 19 4 21 5.900 21 8.500c0 3.700-3.300 6.600-8 10.900z"/>', true),
  plus: svg('<path d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6z"/>'), more: svg('<circle cx="12" cy="5" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="19" r="1.8"/>'),
  down: svg('<path d="M6 9l6 6 6-6"/>', true), back: svg('<path d="M15 5l-7 7 7 7"/>', true), close: svg('<path d="M6 6l12 12M18 6L6 18"/>', true),
  shuffle: svg('<path d="M3 7h3.500c2 0 3.200 1 4.200 2.600l2.600 4.800c1 1.600 2.200 2.600 4.200 2.600H21M3 17h3.500c1.300 0 2.300-.4 3.100-1.200M21 7h-3.500c-1.300 0-2.300.4-3.100 1.200M18 4l3 3-3 3M18 14l3 3-3 3"/>', true),
  repeat: svg('<path d="M7 7h10a3 3 0 0 1 3 3v2M17 17H7a3 3 0 0 1-3-3v-2M14 4l3 3-3 3M10 20l-3-3 3-3"/>', true),
  repeatOne: svg('<path d="M7 7h10a3 3 0 0 1 3 3v2M17 17H7a3 3 0 0 1-3-3v-2M14 4l3 3-3 3M10 20l-3-3 3-3M11.500 10.500l1-.700V14.500"/>', true),
  note: svg('<path d="M9 18V6l10-2v11"/><circle cx="6.500" cy="18" r="2.500"/><circle cx="16.500" cy="15" r="2.500"/>', true),
  list: svg('<path d="M4 7h11M4 12h11M4 17h7M18 10v8M18 10l3 1"/><circle cx="16.200" cy="18" r="1.800"/>', true),

// ------------------------------------------------------------------ storage (everything stays on this phone)
let db;
const openDb = () => new Promise((res, rej) => {
  const r = indexedDB.open('afterglow', 1);
  r.onupgradeneeded = () => { const d = r.result; d.createObjectStore('songs', { keyPath: 'id' }); d.createObjectStore('audio'); d.createObjectStore('covers'); d.createObjectStore('playlists', { keyPath: 'id' }); d.createObjectStore('meta'); };

});
const run = (stores, mode, work) => new Promise((res, rej) => {

// ------------------------------------------------------------------ what the app knows
const S = { songs: new Map(), playlists: [], view: 'songs', playlist: null, q: '', sort: 'recent',
            queue: [], source: [], pos: -1, label: 'Your library', shuffle: false, repeat: 0, playing: false, open: false };
const audio = $('#audio');
const song = id => S.songs.get(id);
const current = () => song(S.queue[S.pos]);
const saveSong = s => put('songs', s);

// ------------------------------------------------------------------ colours: from the song's own cover
const seedHue = s => { let h = 7; for (const c of s) h = (h * 31 + c.codePointAt(0)) >>> 0; return h % 360; };
const hueOf = s => s.hue >= 0 ? s.hue : seedHue(s.title + '|' + s.artist);
const songColor = s => !s ? 'hsl(340 55% 30%)' : s.hue === -2 ? 'hsl(0 0% 26%)' : 'hsl(' + hueOf(s) + ' 55% 30%)';
const songAccent = s => !s ? 'hsl(340 85% 68%)' : s.hue === -2 ? 'hsl(0 0% 88%)' : 'hsl(' + hueOf(s) + ' 88% 70%)';
const art = (s, cls) => s.thumb ? '<img class="' + cls + '" src="' + s.thumb + '" alt="" loading="lazy">'
  : '<div class="' + cls + '" style="background:linear-gradient(135deg,hsl(' + hueOf(s) + ' 55% 46%),hsl(' + (hueOf(s) + 50) % 360 + ' 60% 22%))">' + I.note + '</div>';

async function readCover(bytes, mime) {
  const blob = new Blob([bytes], { type: mime || 'image/jpeg' });

  catch (e) {

  const x = new Float32Array(24), y = new Float32Array(24), weight = new Float32Array(24); let all = 0;

    const r = px[i] / 255, g = px[i + 1] / 255, b = px[i + 2] / 255, most = Math.max(r, g, b), spread = most - Math.min(r, g, b);

    x[bin] += wgt * Math.cos(rad); y[bin] += wgt * Math.sin(rad); weight[bin] += wgt; all += wgt;
  }
  let best = 0; for (let i = 1; i < 24; i++) if (weight[i] > weight[best]) best = i;
  const hue = all < px.length / 4 * 0.02 ? -2 : Math.round((Math.atan2(y[best], x[best]) * 180 / Math.PI + 360) % 360);
  if (picture.close) picture.close();
  return { full, thumb, hue };
}

// ------------------------------------------------------------------ a file's own title, artist and cover
const be32 = (b, p) => ((b[p] << 24) | (b[p + 1] << 16) | (b[p + 2] << 8) | b[p + 3]) >>> 0;

  if (enc === 1 || enc === 2) { while (p + 1 < d.length && (d[p] || d[p + 1])) p += 2; p += 2; } else { while (p < d.length && d[p]) p++; p++; }

}
async function readId3(file, head) {

}

}
const box = (b, want) => { let found = null; if (b) boxes(b, (type, inside) => { if (type === want) { found = inside; return false; } }); return found; };
async function readMp4(file) {
  let at = 0, moov = null;

  sheet('<h3>' + title + '</h3><div class="form"><input class="field" id="name" maxlength="60" placeholder="Playlist name" value="' + esc(value) + '" enterkeyhint="done"><button class="pill main" data-do="' + action + '"' + (extra || '') + '>Save</button></div>');
  $('#name').addEventListener('keydown', e => { if (e.key === 'Enter') $('#sheet .pill.main').click(); });
}
const savePlaylist = p => put('playlists', p);
async function removeSong(id) {
  const now = current() && current().id === id;
  await run(['songs', 'audio', 'covers'], 'readwrite', t => { t.objectStore('songs').delete(id); t.objectStore('audio').delete(id); t.objectStore('covers').delete(id); });
  S.songs.delete(id);
  for (const p of S.playlists) if (p.songs.indexOf(id) >= 0) { p.songs = p.songs.filter(x => x !== id); savePlaylist(p); }
  const at = S.queue.indexOf(id); S.source = S.source.filter(x => x !== id); S.queue = S.queue.filter(x => x !== id);
  if (now) { audio.pause(); audio.removeAttribute('src'); audio.load(); playingUrl = ''; S.playing = false; S.pos = -1; closePlayer(); if (S.queue.length) start(Math.min(at, S.queue.length - 1), false); }
  else if (at >= 0 && at < S.pos) S.pos--;
  prepare(); remember(); render(); toast('Deleted from this phone');
}

// ------------------------------------------------------------------ taps
const labelOf = () => S.view === 'playlist' ? ((S.playlists.find(p => p.id === S.playlist) || {}).name || 'Playlist') : S.q ? 'Search' : S.view === 'liked' ? 'Liked Songs' : 'Your library';
let sure = '';
document.addEventListener('click', e => {
  if (e.target.id === 'shade') return closeSheet();
  const el = e.target.closest('[data-do]'); if (!el) return;
  const act = el.dataset.do, id = el.dataset.id;
  if (act !== 'delete') sure = '';
  switch (act) {
    case 'add': $('#files').click(); break;
    case 'view': S.view = el.dataset.view; if (S.view !== 'playlist') S.playlist = null; render(); $('#list').scrollTop = 0; break;
    case 'sort': S.sort = S.sort === 'az' ? 'recent' : 'az'; remember(); render(); break;
    case 'play': playList(shown(), id, labelOf()); break;
    case 'play-all': playList(shown(), null, labelOf()); break;
    case 'shuffle-all': { const ids = shown(); playList(ids, ids[Math.floor(Math.random() * ids.length)], labelOf(), true); break; }
    case 'menu': e.stopPropagation(); songMenu(id); break;
    case 'open': openPlayer(); break;
    case 'close': closePlayer(); break;
    case 'toggle': toggle(); break;
    case 'next': if (following() >= 0) { bless(); advance(false); } else toast('This is the last song'); break;
    case 'prev': previous(); break;
    case 'shuffle': setShuffle(!S.shuffle); break;
    case 'repeat': S.repeat = (S.repeat + 1) % 3; audio.loop = true; prepare(); remember(); refresh(); toast(['Repeat off', 'Repeating all songs', 'Repeating this song'][S.repeat]); break;
    case 'like': { const s = song(id) || current(); if (!s) break; s.liked = !s.liked; saveSong(s); closeSheet(); if (S.view === 'liked') render(); refresh(); toast(s.liked ? 'Added to Liked Songs' : 'Removed from Liked Songs'); break; }
    case 'play-next': { if (!current()) { closeSheet(); playList([id], id, 'Your library'); break; }
      if (current().id !== id) { S.queue = S.queue.filter((x, i) => x !== id || i === S.pos); S.pos = S.queue.indexOf(current().id); S.queue.splice(S.pos + 1, 0, id); if (S.source.indexOf(id) < 0) S.source.push(id); prepare(); remember(); }
      closeSheet(); toast('Plays next'); break; }
    case 'pick-playlist': pickPlaylist(id); break;
    case 'new-playlist': namePlaylist('New playlist', '', 'create-playlist', id ? ' data-id="' + id + '"' : ''); break;
    case 'create-playlist': { const name = $('#name').value.trim(); if (!name) break; const p = { id: uid(), name, songs: id ? [id] : [], created: Date.now() }; S.playlists.unshift(p); savePlaylist(p); closeSheet();
      if (!id) { S.view = 'playlist'; S.playlist = p.id; } render(); toast(id ? 'Added to “' + name + '”' : 'Created “' + name + '”'); break; }
    case 'add-to': { const p = S.playlists.find(p => p.id === el.dataset.list); if (!p) break; closeSheet(); if (p.songs.indexOf(id) >= 0) { toast('Already in “' + p.name + '”'); break; } p.songs.push(id); savePlaylist(p); render(); toast('Added to “' + p.name + '”'); break; }
    case 'open-playlist': S.view = 'playlist'; S.playlist = id; S.q = ''; $('#q').value = ''; render(); $('#list').scrollTop = 0; break;
    case 'unlist': { const p = S.playlists.find(p => p.id === S.playlist); if (p) { p.songs = p.songs.filter(x => x !== id); savePlaylist(p); } closeSheet(); render(); toast('Removed from this playlist'); break; }
    case 'playlist-menu': sheet('<h3>Playlist</h3><button class="opt" data-do="rename-playlist">Rename</button><button class="opt bad" data-do="delete-playlist">Delete playlist</button><p class="sub" style="margin-top:6px">Deleting a playlist keeps its songs in your library.</p>'); break;
    case 'rename-playlist': { const p = S.playlists.find(p => p.id === S.playlist); if (p) namePlaylist('Rename playlist', p.name, 'save-name'); break; }
    case 'save-name': { const p = S.playlists.find(p => p.id === S.playlist), name = $('#name').value.trim(); if (p && name) { p.name = name; savePlaylist(p); } closeSheet(); render(); break; }
    case 'delete-playlist': { const pid = S.playlist; S.playlists = S.playlists.filter(p => p.id !== pid); run(['playlists'], 'readwrite', t => { t.objectStore('playlists').delete(pid); }); S.view = 'playlists'; S.playlist = null; closeSheet(); render(); toast('Playlist deleted. Its songs are still in your library.'); break; }
    case 'delete': if (sure !== id) { sure = id; el.textContent = 'Tap again to delete it for good'; } else { sure = ''; closeSheet(); removeSong(id); } break;
    case 'hide-hint': try { localStorage.setItem('afterglow-hint', '1'); } catch (x) {} $('#hint').hidden = true; break;
  }
});
$('#q').addEventListener('input', e => { S.q = e.target.value; render(); });
$('#files').addEventListener('change', e => { const f = Array.from(e.target.files || []); e.target.value = ''; if (f.length) importFiles(f); });

// ------------------------------------------------------------------ starting
(async () => {
  try { db = await openDb(); } catch (e) { $('#list').innerHTML = '<div class="empty"><h2>Afterglow can\'t keep songs here</h2><p>This browser window does not allow saving (Private Browsing?). Open Afterglow in a normal Safari tab.</p></div>'; return; }
  const [songs, lists, state] = await Promise.all([getAll('songs'), getAll('playlists'), get('meta', 'state').catch(() => null)]);
  for (const s of songs) S.songs.set(s.id, s);
  S.playlists = lists.sort((a, b) => b.created - a.created);
  if (state) { S.sort = state.sort || 'recent'; S.shuffle = !!state.shuffle; S.repeat = state.repeat || 0; S.label = state.label || 'Your library';
    S.queue = (state.queue || []).filter(id => S.songs.has(id)); S.source = (state.source || []).filter(id => S.songs.has(id)); const was = (state.queue || [])[state.pos]; S.pos = S.queue.indexOf(was); }
  render(); paint();
  if (S.pos >= 0) start(S.pos, false, state.time || 0);            // the last song is there again, paused where it was
  let hidden = false; try { hidden = localStorage.getItem('afterglow-hint') === '1'; } catch (e) {}
  if (!standalone && !hidden && /iPhone|iPad|iPod/.test(navigator.userAgent)) { const h = $('#hint'); h.hidden = false;
    h.innerHTML = '<div style="flex:1"><b>Put Afterglow on your Home Screen first.</b> In Safari tap Share, then “Add to Home Screen”, and add your songs there: the Home Screen app keeps its own songs.' +
      '<div class="ar" lang="ar">ضعي Afterglow على الشاشة الرئيسية أولاً: من Safari اضغطي مشاركة ثم «إضافة إلى الشاشة الرئيسية»، وأضيفي أغانيك هناك.</div></div><button data-do="hide-hint" aria-label="Hide this">' + I.close + '</button>'; }
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
window.__afterglow = { S, importFiles, audio, version: VERSION };       // for checking the page itself
})();
</script>
</body>
